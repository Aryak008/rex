<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReX Phase 2 — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--chrome:#141418;--cline:rgba(255,255,255,.09);
--sa-side:#1A0B22;--sa-side2:#3A1230;--sa-bg:#0A0510;--sa-card:#150B1C;--sa-acc:#FF2D7A;--sa-acc2:#FF7FAC;--sa-ta:#D81B60;--sa-tb:#7B1142;
--cl-side:#120A18;--cl-bg:#09040D;--cl-card:#140B1B;--cl-acc:#FF2D7A;--cl-acc2:#E0185F;--cl-glow:rgba(255,45,122,.13);
--line:rgba(255,255,255,.07);--txt:#fff;--t2:#9AA4B5;--t3:#5F6A7C;
--ok:#22C55E;--warn:#F59E0B;--err:#EF4444;--new:#A855F7;color-scheme:dark}
*{box-sizing:inherit}html,body{margin:0;height:100%}
body{background:#0A0A0C;color:var(--txt);font-family:Inter,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",monospace}
#chrome{position:sticky;top:0;z-index:200;background:var(--chrome);border-bottom:1px solid var(--cline);
 padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:14px;white-space:nowrap}.brand span{color:var(--t3);font-weight:500}
.planes{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:4px;border-radius:999px}
.pbtn{border:0;background:transparent;color:var(--t2);cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;white-space:nowrap}
.pbtn:hover{color:#fff}.pbtn.on{background:#fff;color:#111}
.cnote{font-size:11.5px;color:var(--t3);margin-left:auto}
.app{display:flex;min-height:660px}.app.sa{background:var(--sa-bg)}.app.cl,.app.ca{background:var(--cl-bg)}
.side{width:196px;flex:0 0 196px;padding-bottom:26px;border-right:1px solid rgba(255,255,255,.05);overflow-y:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
.sa .side{background:linear-gradient(180deg,#E6186A 0%,#B2165C 32%,#5E1138 62%,#1A0B22 86%)}.cl .side{background:var(--cl-side)}
.side::-webkit-scrollbar{width:4px}.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.logo{padding:17px 16px 14px}.logo b{font-size:21px;font-weight:800;letter-spacing:-.04em}
.sa .logo i{color:var(--sa-acc2);font-style:normal}.cl .logo i{color:var(--cl-acc);font-style:normal}
.sgrp{font-size:9px;letter-spacing:.11em;font-weight:700;color:var(--t3);padding:13px 16px 6px}
.nav{padding:8px 13px;margin:1px 8px;border-radius:9px;color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;position:relative;display:flex;gap:9px;align-items:center}
.sa .side{width:112px;flex:0 0 112px}
.sa .nav{flex-direction:column;gap:6px;text-align:center;padding:11px 6px;margin:3px 7px;line-height:1.25;font-size:10.5px}
.sa .nav .ic{width:17px;height:17px;flex:0 0 17px;opacity:.95}
.sa .logo{padding:15px 10px 10px;text-align:center}.sa .logo b{font-size:19px}
.sa .sgrp{text-align:center;padding:9px 6px 5px;font-size:8px}
.nav:hover{background:rgba(255,255,255,.04);color:#fff}
.nav .ic{width:14px;height:14px;opacity:.8;flex:0 0 14px}
.sa .nav.on{background:rgba(90,16,52,.78);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.cl .nav.on{background:var(--cl-glow);color:#fff}.cl .nav.on::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--cl-acc)}
.nav .nw{margin-left:auto;font-size:8px;font-weight:700;letter-spacing:.06em;background:rgba(168,85,247,.2);color:#C77DFF;padding:2px 5px;border-radius:4px}
.build{margin:16px 10px 0;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.build b{display:block;font-size:11.5px}.build span{font-size:10px;color:var(--t3)}
.main{flex:1;min-width:0}
.topbar{height:56px;display:flex;align-items:center;padding:0 22px;gap:11px}
.sa .topbar{background:linear-gradient(90deg,#E6186A,#7B1142)}
.cl .topbar{justify-content:flex-end;padding-top:13px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:11.5px}
.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.sa .avatar{background:rgba(255,255,255,.17)}.cl .avatar{background:linear-gradient(135deg,var(--cl-acc),var(--cl-acc2))}
.sp{margin-left:auto}
.page{padding:20px 24px 70px}
.crumb{font-size:11px;color:var(--t3);margin-bottom:8px}
.sa .crumb a{color:var(--sa-acc2)}.cl .crumb a{color:var(--cl-acc)}.crumb a{text-decoration:none;cursor:pointer}
.h1{font-size:24px;font-weight:700;letter-spacing:-.025em;margin:0 0 4px}
.sub{color:var(--t2);font-size:12.5px;margin:0 0 18px}
.rowtop{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}.rowtop .sub{margin-bottom:0}
.btn{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;padding:9px 16px;border-radius:9px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.sa .btn.pri{background:var(--sa-acc);color:#fff}.cl .btn.pri{background:linear-gradient(135deg,var(--cl-acc),var(--cl-acc2));color:#fff}
.btn.sec{background:rgba(255,255,255,.06);color:var(--txt);border:1px solid rgba(255,255,255,.11)}
.btn.gho{background:transparent;color:var(--t2);border:1px solid rgba(255,255,255,.11)}
.btn.dan{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.3)}
.btn:hover{filter:brightness(1.12)}
.card{border-radius:15px;padding:18px;border:1px solid var(--line)}
.sa .card{background:var(--sa-card)}.cl .card{background:var(--cl-card)}
.card.t{padding:14px}
.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.side{display:none}}
.stat{border-radius:15px;padding:16px 18px;border:1px solid var(--line);position:relative}
.sa .stat{background:var(--sa-card)}.cl .stat{background:var(--cl-card)}
.stat .lab{font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--t3);text-transform:uppercase}
.stat .num{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
.stat .sl{font-size:11px;color:var(--t3)}
.stat .it{position:absolute;top:14px;right:15px;width:31px;height:31px;border-radius:9px;display:grid;place-items:center}
.sa .stat .it{background:rgba(59,130,246,.14)}.cl .stat .it{background:rgba(255,45,122,.14)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--t3);text-transform:uppercase;padding:0 13px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.045)}
.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover td{background:rgba(255,255,255,.022)}
.prim{font-weight:600;color:#fff}.second{font-size:10.5px;color:var(--t3);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:rgba(34,197,94,.14);color:#4ADE80}.pill.warn{background:rgba(245,158,11,.14);color:#FBBF24}
.pill.err{background:rgba(239,68,68,.14);color:#F87171}.pill.info{background:rgba(59,130,246,.15);color:#93C5FD}
.pill.mag{background:rgba(255,45,122,.15);color:#FF7FAC}.pill.mute{background:rgba(255,255,255,.07);color:var(--t2)}
.pill.new{background:rgba(168,85,247,.18);color:#C77DFF}
.stepper{display:flex;align-items:center;margin:0 0 22px;overflow-x:auto;padding-bottom:4px}
.step{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.step .bub{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:0 0 25px;border:1.5px solid rgba(255,255,255,.18);color:var(--t3)}
.sa .step.done .bub{background:var(--sa-acc);border-color:var(--sa-acc);color:#fff}
.cl .step.done .bub{background:var(--cl-acc);border-color:var(--cl-acc);color:#fff}
.sa .step.cur .bub{border-color:var(--sa-acc);color:var(--sa-acc2);box-shadow:0 0 0 4px rgba(59,130,246,.14)}
.cl .step.cur .bub{border-color:var(--cl-acc);color:var(--cl-acc);box-shadow:0 0 0 4px rgba(255,45,122,.14)}
.step .lbl{font-size:8.5px;letter-spacing:.09em;font-weight:700;color:var(--t3);text-transform:uppercase;line-height:1.3}
.step .lbl b{display:block;font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--t2);font-weight:600;white-space:nowrap}
.step.cur .lbl b,.step.done .lbl b{color:#fff}
.sline{height:1px;background:rgba(255,255,255,.12);flex:1 1 24px;min-width:18px;margin:0 9px}
.sa .sline.done{background:var(--sa-acc)}.cl .sline.done{background:var(--cl-acc)}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--t2);text-transform:uppercase;margin-bottom:6px}
.req{color:var(--err);margin-left:3px}
.inp{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:10px 12px;color:#fff;font:inherit;font-size:12.5px}
.inp::placeholder{color:var(--t3)}.inp[readonly]{background:rgba(255,255,255,.03);color:var(--t2)}
.sa .inp:focus{outline:0;border-color:var(--sa-acc)}.cl .inp:focus{outline:0;border-color:var(--cl-acc)}
.help{font-size:10.5px;color:var(--t3);margin-top:5px}.help.ok{color:#4ADE80}.help.err{color:#F87171}
.sfxw{display:flex}.sfxw .inp{border-radius:9px 0 0 9px;border-right:0}
.sfx{display:grid;place-items:center;padding:0 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:0 9px 9px 0;font-size:12px;color:var(--t2)}
.banner{border-radius:10px;padding:12px 14px;font-size:12px;display:flex;gap:10px;line-height:1.55}
.banner.info{background:rgba(59,130,246,.09);border:1px solid rgba(59,130,246,.22);color:#BFDBFE}
.banner.warn{background:rgba(245,158,11,.09);border:1px solid rgba(245,158,11,.25);color:#FDE68A}
.banner.err{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.25);color:#FCA5A5}
.banner.ok{background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.25);color:#BBF7D0}
.anno{margin:16px 0 0;border-left:3px solid var(--new);background:rgba(168,85,247,.07);border-radius:0 10px 10px 0;padding:12px 15px;font-size:11.5px;color:#DDD6FE;line-height:1.6}
.anno b{color:#C77DFF;display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.ptree{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.phead,.pfoot{display:flex;align-items:center;gap:10px;padding:11px 14px;background:rgba(255,255,255,.03);font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--t3);text-transform:uppercase}
.phead{border-bottom:1px solid var(--line)}.pfoot{border-top:1px solid var(--line);font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--t2)}
.prow{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.prow:last-child{border-bottom:0}.prow:hover{background:rgba(255,255,255,.02)}
.prow .d{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.prow.l1{font-weight:700;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase}.prow.l1 .d{background:#60A5FA}
.prow.l2{padding-left:32px;font-weight:600}.prow.l2 .d{background:#A78BFA}
.prow.l3{padding-left:52px;color:var(--t2)}.prow.l3 .d{background:#4ADE80;width:5px;height:5px;flex:0 0 5px}
.prow.l4{padding-left:72px;color:var(--t3)}.prow.l4 .d{background:#FBBF24;width:5px;height:5px;flex:0 0 5px}
.prow .acc{margin-left:auto;display:flex;align-items:center;gap:8px}
.chk{width:17px;height:17px;border-radius:5px;border:1.5px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:10px;flex:0 0 17px;cursor:pointer}
.sa .chk.on{background:var(--sa-acc);border-color:var(--sa-acc);color:#fff}
.sa .nav{color:rgba(255,255,255,.82)}.sa .nav:hover{background:rgba(255,255,255,.1);color:#fff}
.sa .sgrp{color:rgba(255,255,255,.6)}
.cl .chk.on{background:var(--cl-acc);border-color:var(--cl-acc);color:#fff}
.chk.part{background:rgba(59,130,246,.3);border-color:var(--sa-acc);color:#93C5FD}
.chk.off{color:transparent}.chk.lk{opacity:.3;border-style:dashed;cursor:not-allowed}
.prow.blk{opacity:.42}
.lw{font-size:9.5px;color:#FBBF24;background:rgba(245,158,11,.1);padding:2px 7px;border-radius:5px;white-space:nowrap}
.co{color:#4ADE80;font-weight:700}.cn{color:var(--t2);font-weight:600}
.rps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.rp{padding:7px 13px;border-radius:999px;font-size:11.5px;font-weight:600;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--t2)}
.sa .rp.on{background:var(--sa-acc);border-color:var(--sa-acc);color:#fff}
.cl .rp.on{background:var(--cl-acc);border-color:var(--cl-acc);color:#fff}
.rp .n{font-size:9.5px;opacity:.75;margin-left:4px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
.kv:last-child{border-bottom:0}.kv .k{color:var(--t3)}.kv .v{font-weight:600;text-align:right}
.sh{font-size:9.5px;letter-spacing:.11em;font-weight:700;color:var(--t3);text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:9px}
.sh::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.07)}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,.07);overflow-x:auto}
.tab{padding:9px 15px;font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:#fff}.sa .tab.on{color:#fff;border-bottom-color:var(--sa-acc)}.cl .tab.on{color:#fff;border-bottom-color:var(--cl-acc)}
.srch{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 12px;font-size:12px;color:var(--t3);min-width:190px}
.fr{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.wf{display:flex;gap:9px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)}
.rstep{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid rgba(255,255,255,.045);font-size:12px}
.rstep:last-child{border-bottom:0}
.rstep .n{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;background:rgba(255,255,255,.06);color:var(--t3);flex:0 0 21px}
.rstep.done .n{background:rgba(34,197,94,.18);color:#4ADE80}.rstep.run .n{background:rgba(59,130,246,.2);color:#93C5FD}
.rstep.pend{opacity:.45}.rstep .t{flex:1}.rstep .du{font-size:10.5px;color:var(--t3)}
.avg{display:grid;grid-template-columns:48px repeat(7,1fr);gap:3px;font-size:10px}
.avg .hd{text-align:center;color:var(--t3);font-weight:700;font-size:9px;padding-bottom:4px}
.avg .hr{color:var(--t3);text-align:right;padding-right:7px;line-height:24px}
.avc{height:24px;border-radius:5px;background:rgba(255,255,255,.035);cursor:pointer}
.cl .avc.on{background:rgba(255,45,122,.42)}.sa .avc.on{background:rgba(59,130,246,.42)}
.chain{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:14px 0}
.cnode{padding:9px 14px;border-radius:9px;font-size:11.5px;font-weight:600;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);white-space:nowrap}
.cl .cnode.ai{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.4);color:#C77DFF}
.cl .cnode.cur{background:rgba(255,45,122,.16);border-color:var(--cl-acc);color:#FF7FAC}
.carr{color:var(--t3);font-size:14px}
.sp16{height:16px}.hidden{display:none!important}
.ca .page{max-width:860px;margin:0 auto}
pre.flow{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--t2);line-height:1.75;margin:0;overflow-x:auto}
.lp{max-width:1180px;margin:0 auto;padding:34px 24px 80px}
.lp-hero{text-align:center;padding:18px 0 30px}
.lp-hero h1{font-size:34px;font-weight:800;letter-spacing:-.035em;margin:0 0 10px}
.lp-hero p{color:var(--t2);font-size:14px;max-width:660px;margin:0 auto;line-height:1.65}
.lp-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0 34px}
@media(max-width:860px){.lp-kpi{grid-template-columns:repeat(2,1fr)}}
.lp-k{border-radius:14px;padding:16px 18px;border:1px solid var(--line);background:var(--cl-card)}
.lp-k .n{font-size:27px;font-weight:800;letter-spacing:-.03em}
.lp-k .l{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--t3);text-transform:uppercase;margin-top:5px}
.lp-sec{margin:38px 0 0}
.lp-sec h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0 0 5px;display:flex;align-items:center;gap:10px}
.lp-sec .d{font-size:12.5px;color:var(--t2);margin:0 0 18px;line-height:1.6;max-width:760px}
.lp-item{border-radius:13px;border:1px solid var(--line);background:var(--cl-card);padding:16px 18px;margin-bottom:11px}
.lp-item .top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lp-item h3{font-size:14.5px;font-weight:700;margin:0 0 3px}
.lp-item .fd{font-size:10.5px;color:#93C5FD;font-family:"JetBrains Mono",monospace}
.lp-item .ex{font-size:12px;color:var(--t2);margin:11px 0 0;line-height:1.65}
.lp-item .ex b{color:#fff;font-weight:600}
.lp-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.lp-b{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04);color:var(--t2);cursor:pointer;
 font:inherit;font-size:11.5px;font-weight:600;padding:7px 13px;border-radius:8px;white-space:nowrap}
.lp-b:hover{color:#fff;border-color:var(--cl-acc);background:rgba(255,45,122,.1)}
.lp-tag{font-size:9px;letter-spacing:.09em;font-weight:700;padding:4px 9px;border-radius:5px;white-space:nowrap}
.lp-same{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:860px){.lp-same{grid-template-columns:repeat(2,1fr)}}
.lp-s{border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:12px 14px}
.lp-s b{font-size:12.5px;display:block;margin-bottom:3px}
.lp-s span{font-size:11px;color:var(--t3);line-height:1.5;display:block}
.lp-s button{margin-top:9px;border:0;background:none;color:var(--cl-acc);font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:0}

function lpItem(it,kind){
 const b=BADGE[kind];
 return `<div class="lp-item"><div class="top">
  <span class="lp-tag" style="color:${b[1]};background:${b[2]}">${b[0]}</span>
  <div style="flex:1;min-width:220px"><h3>${it[0]}</h3><div class="fd">${it[1]}</div></div></div>
  <p class="ex">${it[2]}</p>
  <p class="ex"><b>What to expect:</b> ${it[3]}</p>
  <div class="lp-btns">${it[4].map(x=>`<button class="lp-b" onclick="go('${x[1]}')">${x[0]} →</button>`).join('')}</div></div>`;
}
S.lp=()=>`<div class="app cl"><div class="main"><div class="lp">

<div class="lp-kpi">
 <div class="lp-k"><div class="n" style="color:#C77DFF">${NEW_ITEMS.length}</div><div class="l">New capabilities</div></div>

 <div class="lp-k"><div class="n" style="color:var(--t2)">${SAME_ITEMS.length}</div><div class="l">Unchanged</div></div>
 <div class="lp-k"><div class="n">${Object.keys(REF).length}</div><div class="l">Screens in this prototype</div></div></div>
<div class="banner info"><span>ℹ</span><div><b>How to use this.</b> Switch plane at the top: Super Admin, Client Platform or Candidate. Every sidebar item opens. A bar under the header shows whether the screen is new, changed or existing, and gives its exact Foundation Document reference. Purple notes at the foot of each screen explain the spec decision behind what you are looking at.</div></div>

<div class="lp-sec"><h2><span style="color:#C77DFF">●</span> What's new</h2>

<div class="lp-sec"><h2><span style="color:var(--t3)">●</span> What stays the same</h2>

<div class="lp-same">${SAME_ITEMS.map(s=>`<div class="lp-s"><b>${s[0]}</b><span>${s[2]}</span><button onclick="go('${s[1]}')">Open →</button></div>`).join('')}</div></div>

<div class="lp-sec"><h2>The three-layer guard</h2>
<p class="d">The single idea everything else hangs off. Worth reading before any of the screens.</p>
<div class="card"><pre class="flow">Plan            143   what can be sold          §3.3 · S24
  └─ Organisation 125   what this client bought  §3.1 · S6
       └─ Role      39   what this person does   §3.1 · S7

Each layer is bounded by the one above, checked at grant time
and again on every request.

step 6 totals 125: the 18 the organisation does not hold

<div class="lp-btns"><button class="lp-b" onclick="go('sa_p4')">Layer 1 · Plan →</button>

           Usage metering instrumentation
           Confirm the application record

PHASE 2b   Candidate Portal

PHASE 2c   AI Interviewer + report + validation gate
           Booking Slots  (interviewer half can start in 2a)
           Assessment Rounds

PHASE 2d   Offer Management

PARALLEL   Branded deployment

<div class="card"><div class="sh">On the screen</div>

${FOOT('ReX Phase 2 Prototype')}

function drawFD(id){
 const el=document.getElementById('fdbar');
 if(id==='lp'){el.innerHTML='';return;}
 const r=REF[id]||['exists','—','—'], b=BADGE[r[0]];
 el.innerHTML=`<div style="position:sticky;top:0;z-index:150;background:#101014;border-bottom:1px solid var(--cline);
  padding:9px 16px;display:flex;gap:11px;align-items:center;flex-wrap:wrap;font-size:11.5px">
  <button onclick="go('lp')" style="border:1px solid rgba(255,255,255,.13);background:transparent;color:var(--t2);
   font:inherit;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer">← Overview</button>
  <span class="lp-tag" style="color:${b[1]};background:${b[2]}">${b[0]}</span>
  <span style="color:var(--t3)">Foundation Document</span>
  <span class="mono" style="color:#93C5FD;font-weight:500">${r[1]}</span>
  <span style="color:var(--t3)">·</span><span style="color:var(--t2)">${r[2]}</span>
  <span style="margin-left:auto;color:var(--t3);font-size:10.5px">screen id: <span class="mono">${id}</span></span></div>`;
}
const HOME={lp:'lp',sa:'sa_orgs',cl:'cl_jd',ca:'ca_apps'};
let cur='lp';
function go(id){ if(!S[id])return; cur=id; drawFD(id);
 document.getElementById('stage').innerHTML=S[id]();
 const p=id==='lp'?'lp':id.slice(0,2);
 document.querySelectorAll('.pbtn[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===p));
 window.scrollTo({top:0,behavior:'smooth'}); }
document.querySelectorAll('.pbtn[data-p]').forEach(b=>b.onclick=()=>go(HOME[b.dataset.p]));
go('lp');
</script></body></html>
